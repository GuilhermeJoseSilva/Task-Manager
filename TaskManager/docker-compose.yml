version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: taskmanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - taskmanager_data:/var/lib/postgresql/data

volumes:
  taskmanager_data: